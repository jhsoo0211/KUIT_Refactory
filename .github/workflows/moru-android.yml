name: MORU Android CI

on:
  pull_request:
    paths:
      - "projects/moru-android/**"
      - ".github/workflows/moru-android.yml"
  push:
    branches:
      - main
    paths:
      - "projects/moru-android/**"
      - ".github/workflows/moru-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moru-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/moru-android

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify debug and unsigned release candidates
        run: ./gradlew testDebugUnitTest testReleaseUnitTest verifyLintWarningBudget assembleDebug assembleRelease --stacktrace
